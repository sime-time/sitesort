config:
  edition: 3

streams:
  user_jobs:
    auto_subscribe: true
    queries:
      - SELECT jobs.*
        FROM jobs
        WHERE jobs.user_id = auth.user_id()
  user_job_materials:
    auto_subscribe: true
    queries:
      - SELECT job_materials.*
        FROM job_materials
        JOIN jobs ON jobs.id = job_materials.job_id
        WHERE jobs.user_id = auth.user_id()
  user_materials:
    auto_subscribe: true
    queries:
      - SELECT *
        FROM materials
  user_tasks:
    auto_subscribe: true
    queries:
      - SELECT tasks.*
        FROM tasks
        JOIN jobs ON jobs.id = tasks.job_id
        WHERE jobs.user_id = auth.user_id()
  categories:
    auto_subscribe: true
    queries:
      - SELECT categories.*
        FROM categories
  job_templates:
    auto_subscribe: true
    queries:
      - SELECT job_templates.*
        FROM job_templates
  template_tasks:
    auto_subscribe: true
    queries:
      - SELECT template_tasks.*
        FROM template_tasks
  template_materials:
    auto_subscribe: true
    queries:
      - SELECT template_materials.*
        FROM template_materials
  user_time_entries:
    auto_subscribe: true
    queries:
      - SELECT time_entries.*
        FROM time_entries 
        WHERE time_entries.user_id = auth.user_id()
